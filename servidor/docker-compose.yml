name: moscasstream

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo accesible desde este PC (para pgAdmin/DBeaver), nunca desde la red.
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TMDB_TOKEN: ${TMDB_TOKEN:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-es-ES}
    volumes:
      - uploads:/app/uploads
      # Carpeta compartida con Windows: deja aquí los listados .txt y se importan al arrancar.
      - ./importacion:/app/importacion
    # Expuesto en toda la red local para que los dispositivos Android lo alcancen.
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
